# Day 4 / Lab 4.5: the app as a Flux HelmRelease: the OCI chart, rendered with the
# values.yaml from this same repo (via the todo-values ConfigMap generated below).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: todo
spec:
  interval: 5m
  # Flux starts the cnpg Cluster and this release together; until cnpg has created the
  # db-app Secret the app can't start. Retry a failed first install instead of giving up.
  install:
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: todo-chart
  valuesFrom:
    - kind: ConfigMap
      name: todo-values
      valuesKey: values.yaml
