# Day 3 / Lab 12b (going further) — an alert on a SYMPTOM: the app can't reach its DB.
# db_up is a gauge the app reports at every scrape (1 = ping ok, 0 = not).
# "for: 2m" avoids flapping on a single failed scrape. The rule lands in the
# platform's Prometheus; a firing alert shows up in Alertmanager (home.<domain>)
# and in Rancher (your cluster -> Cluster Dashboard -> "Alerts" tab).
# Prometheus adds the "namespace" label to every scraped sample, so {{ $labels.namespace }}
# tells you WHOSE app is down — with 20 students on one cluster that matters.
#
#   kubectl apply -n student-NN -f day3/10-prometheusrule.yaml
#   kubectl scale statefulset/db --replicas=0      # → db_up 0 → fires after 2 min
#   kubectl scale statefulset/db --replicas=1      # → resolves
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: todo-alerts
  labels:
    app: todo
spec:
  groups:
    - name: todo
      rules:
        - alert: TodoDatabaseDown
          # max by (namespace): ONE alert per namespace, not one per Pod — with 4
          # replicas a plain "db_up == 0" would fire four times for the same DB.
          expr: max by (namespace) (db_up) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "[{{ $labels.namespace }}] todo app cannot reach its database"
            message: "[{{ $labels.namespace }}] todo app cannot reach its database (db_up == 0 on every Pod)"
            description: "Namespace {{ $labels.namespace }}: db_up has been 0 on all app Pods for 2 minutes. The app keeps running (liveness ok) but is not Ready; users get a 503 page."
        - alert: TodoHighErrorRate
          expr: >
            sum by (namespace) (rate(http_requests_total{status=~"5.."}[5m]))
              / sum by (namespace) (rate(http_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "[{{ $labels.namespace }}] more than 5 % of todo requests fail"
            message: "[{{ $labels.namespace }}] more than 5 % of todo requests fail (5xx ratio over 5 min)"
            description: "Namespace {{ $labels.namespace }}: the 5xx share of http_requests_total exceeded 5 % for 5 minutes — the symptom users feel; check db_up for the cause."
