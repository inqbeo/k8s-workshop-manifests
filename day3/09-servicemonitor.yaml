# Day 3 / Lab 3.5: make YOUR app's metrics visible to the cluster's Prometheus.
# The todo app serves Prometheus metrics on GET /metrics (http_requests_total,
# todos, db_up, …) on its separate metrics listener :8081, exposed in-cluster as
# Service port "metrics" (08-metrics-port.yaml). The platform's Prometheus
# Operator (rancher-monitoring) watches ServiceMonitor objects in every namespace
# and rewrites its scrape config: select the Service by label, scrape every Pod
# behind it, INCLUDING Pods that are not Ready. (Readiness only removes a Pod
# from the Service's load-balancing; the Operator discovers Pod IPs through the
# Endpoints object, where not-ready Pods are still listed. That is why db_up
# keeps reporting 0 while the DB is down instead of the target disappearing.)
#
#   kubectl apply -n student-NN -f day3/09-servicemonitor.yaml
#   # Prometheus UI → Status → Targets → serviceMonitor/student-NN/app/0 → 4 Pods UP
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: app
  labels:
    app: todo
spec:
  selector:
    matchLabels:
      app: todo             # the Day-2 Service "app" carries this label
  endpoints:
    - port: metrics         # the Service's port NAME (not the number!): 8081, not "http"
      path: /metrics
      interval: 15s
